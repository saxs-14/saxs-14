<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Phathutshedzo Mamagau - Software Engineer, HPC and AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset="0.55" stop-color="#0A2A6B"/>
      <stop offset="1" stop-color="#0057D9"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6F6FF"/>
      <stop offset="0.5" stop-color="#7DE3FF"/>
      <stop offset="1" stop-color="#E6F6FF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="wave">
      <rect width="1200" height="300" rx="18"/>
    </clipPath>
    <style>
      .trace { fill: none; stroke: #22D3EE; stroke-width: 2; stroke-opacity: 0.35; }
      .flow  { fill: none; stroke: #7DF9FF; stroke-width: 2.5; stroke-dasharray: 14 220; animation: flow 4s linear infinite; }
      .flow.d2 { animation-duration: 5.5s; animation-delay: -2s; }
      .flow.d3 { animation-duration: 3.5s; animation-delay: -1s; }
      .node  { fill: #0A2A6B; stroke: #22D3EE; stroke-width: 2; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .sym   { font-family: 'Consolas','Courier New',monospace; fill: #38BDF8; }
      .bin   { font-family: 'Consolas','Courier New',monospace; font-size: 13px; fill: #38BDF8; fill-opacity: 0.22; }
      .float { animation: float 6s ease-in-out infinite; }
      .float.f2 { animation-delay: -3s; }
      .cursor { animation: blink 1s steps(1) infinite; }
      .fade  { animation: fadein 1.2s ease-out both; }
      @keyframes flow  { from { stroke-dashoffset: 234; } to { stroke-dashoffset: 0; } }
      @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    </style>
  </defs>

  <g clip-path="url(#wave)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- binary rain columns -->
    <text class="bin" x="40" y="40">01001000 10110</text>
    <text class="bin" x="60" y="230">11010 0110 1001</text>
    <text class="bin" x="980" y="45">1011 0010 1110</text>
    <text class="bin" x="1010" y="220">0101 1100 0011</text>
    <text class="bin" x="470" y="28">0x4D 0x50 0x49 0x52 0x55 0x4E</text>

    <!-- circuit traces, left -->
    <path class="trace" d="M0 90H90L120 120H200"/>
    <path class="trace" d="M0 160H60L90 190H170L190 210"/>
    <path class="trace" d="M120 0V40L150 70H240"/>
    <path class="flow"  d="M0 90H90L120 120H200"/>
    <path class="flow d2" d="M0 160H60L90 190H170L190 210"/>
    <path class="flow d3" d="M120 0V40L150 70H240"/>
    <circle class="node" cx="200" cy="120" r="5"/>
    <circle class="node" cx="190" cy="210" r="5"/>
    <circle class="node" cx="240" cy="70" r="5"/>

    <!-- circuit traces, right -->
    <path class="trace" d="M1200 80H1110L1080 110H990"/>
    <path class="trace" d="M1200 170H1140L1110 200H1030"/>
    <path class="trace" d="M1080 0V30L1050 60H960"/>
    <path class="flow"  d="M1200 80H1110L1080 110H990"/>
    <path class="flow d3" d="M1200 170H1140L1110 200H1030"/>
    <path class="flow d2" d="M1080 0V30L1050 60H960"/>
    <circle class="node" cx="990" cy="110" r="5"/>
    <circle class="node" cx="1030" cy="200" r="5"/>
    <circle class="node" cx="960" cy="60" r="5"/>

    <!-- CPU chip, left -->
    <g transform="translate(285 210)"><g class="float">
      <g filter="url(#glow)">
        <rect x="0" y="0" width="56" height="56" rx="6" fill="#06163A" stroke="#22D3EE" stroke-width="2"/>
        <rect x="14" y="14" width="28" height="28" rx="3" fill="none" stroke="#7DF9FF" stroke-width="1.5"/>
        <text x="28" y="33" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#7DF9FF">CPU</text>
        <path d="M10 0V-8M20 0V-8M30 0V-8M40 0V-8M50 0V-8M10 56V64M20 56V64M30 56V64M40 56V64M50 56V64M0 10H-8M0 20H-8M0 30H-8M0 40H-8M0 50H-8M56 10H64M56 20H64M56 30H64M56 40H64M56 50H64" stroke="#22D3EE" stroke-width="2"/>
      </g>
    </g></g>

    <!-- code symbols -->
    <text class="sym float" x="905" y="160" font-size="42" filter="url(#glow)">&lt;/&gt;</text>
    <text class="sym float f2" x="320" y="95" font-size="34" fill-opacity="0.8">{ }</text>
    <text class="sym float f2" x="860" y="250" font-size="22" fill-opacity="0.7">λ</text>
    <path class="pulse" d="M1138 108L1122 136H1134L1128 158L1146 128H1134Z" fill="#7DF9FF"/>
    <text class="sym pulse" x="30" y="125" font-size="22">∑</text>

    <!-- server rack, right -->
    <g transform="translate(1110 228)"><g class="float f2" fill="none" stroke="#22D3EE" stroke-width="1.8">
      <rect x="0" y="0" width="44" height="12" rx="2"/>
      <rect x="0" y="16" width="44" height="12" rx="2"/>
      <circle class="pulse" cx="36" cy="6" r="2" fill="#7DF9FF" stroke="none"/>
      <circle class="pulse" cx="36" cy="22" r="2" fill="#7DF9FF" stroke="none"/>
    </g></g>

    <!-- title -->
    <g>
      <text x="600" y="128" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="56" font-weight="700" fill="url(#title)" filter="url(#glow)">Phathutshedzo Mamagau</text>
      <text x="600" y="172" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#9BE7FF" letter-spacing="1">Software Engineer · HPC and AI · Building for South Africa</text>
      <text x="600" y="210" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#7DF9FF" fill-opacity="0.85">$ ./build --for=south-africa --mode=real<tspan class="cursor">_</tspan></text>
    </g>
  </g>
</svg>
